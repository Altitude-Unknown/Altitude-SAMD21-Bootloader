name: Build and test

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the ARM compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Host tests (simulated SAMD21)
        run: make test
      - name: Build every board
        run: make all TOOLCHAIN=/usr/bin/
      - name: Check sizes (must fit in 8 KB)
        run: |
          for f in build/*/*.bin; do
            size=$(stat -c %s "$f"); echo "$f: $size bytes"
            [ "$size" -le 8192 ] || { echo "::error::$f is larger than 8 KB"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bootloaders
          path: build/*/*.bin
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/*/*.bin --title "Altitude SAMD21 Bootloader ${{ github.ref_name }}" --generate-notes
