name: Build and test

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the ARM compiler (the same release the Arduino SAMD core ships, so builds match)
        run: |
          curl -sSfL -o gcc.tar.bz2 "https://developer.arm.com/-/media/Files/downloads/gnu-rm/9-2019q4/gcc-arm-none-eabi-9-2019-q4-major-x86_64-linux.tar.bz2"
          mkdir -p "$RUNNER_TEMP/gcc" && tar -xjf gcc.tar.bz2 -C "$RUNNER_TEMP/gcc" --strip-components=1
          echo "TOOLCHAIN=$RUNNER_TEMP/gcc/bin/" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/gcc/bin/arm-none-eabi-gcc" --version | head -n 1
      - name: Host tests (simulated SAMD21)
        run: make test
      - name: Build every board
        run: make all TOOLCHAIN=$TOOLCHAIN && sha256sum build/*/*.bin
      - name: Check sizes (exactly 8 KB, padded)
        run: |
          for f in build/*/*.bin; do
            size=$(stat -c %s "$f"); echo "$f: $size bytes"
            [ "$size" -eq 8192 ] || { echo "::error::$f is not 8 KB (the code must fit in 8 KB)"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bootloaders
          path: build/*/*.bin
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/*/*.bin --title "Altitude SAMD21 Bootloader ${{ github.ref_name }}" --generate-notes
